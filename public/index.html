<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小镇一角 · A Corner of Town</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/town/street.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      [hidden] { display: none !important; }
      body.front { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
      .front .stage { position: relative; flex: 1; min-height: 0; }
      .front #street { position: absolute; inset: 0; }
      .front .lang-toggle { left: auto; right: 14px; }
      .front .copy {
        position: absolute; z-index: 6; top: 22px; left: 28px; max-width: 24rem; pointer-events: none;
      }
      .front .copy > * { pointer-events: auto; }
      .front .kicker { margin: 0; }
      .front h1 { margin: 0.1em 0 0.25em; font-size: clamp(2.2rem, 5vw, 3.2rem); }
      .front .lede { margin: 0 0 0.6rem; line-height: 1.8; font-size: 0.98rem; color: var(--ink); text-shadow: 0 0 10px var(--paper), 0 0 4px var(--paper); }
      .front .btn { margin: 0.6rem 0 0.4rem; font-size: 1.08rem; padding: 0.6em 1.7em; text-decoration: none; display: inline-block; }
      .front .hint { margin: 0.2rem 0 0; }
      .front .foot { position: absolute; z-index: 6; left: 0; right: 0; bottom: 10px; text-align: center; margin: 0; pointer-events: none; }
      .front .foot a { pointer-events: auto; margin: 0 0.6em; color: var(--ink-soft); }
      .front .foot button { pointer-events: auto; font: inherit; color: var(--ink-soft); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; margin: 0 0.6em; }
      #town-error { color: var(--stitch); }
      @media (max-width: 700px), (max-aspect-ratio: 4/5) {
        .front .copy { position: static; max-width: none; padding: 52px 16px 0; text-align: center; }
        .front .lede { font-size: 0.9rem; line-height: 1.7; }
        .front .btn { margin-top: 0.3rem; }
      }
    </style>
  </head>
  <body class="front">
    <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
    <section class="copy">
      <p class="kicker" id="kicker">A Corner of Town</p>
      <h1 id="h1">小镇一角</h1>
      <p class="lede" id="lede"></p>
      <button id="start-town" class="btn" type="button">开始我的小镇</button>
      <a id="back-town" class="btn" href="#" hidden>回到我的小镇</a>
      <p class="small hint" id="hint"></p>
      <p id="town-error" class="small" role="status" hidden></p>
    </section>
    <main class="stage">
      <div id="street"></div>
      <p class="small foot">
        <button id="older" type="button">更早的贴纸版本</button>
        <a href="/readme/" id="about-link">关于这个作品</a>
      </p>
    </main>
    <script type="module">
      import { createStreet } from "/town/street.js";
      import { currentSeason } from "/shops/season.js";

      const TEXT = {
        zh: {
          kicker: "A Corner of Town", h1: "小镇一角", toggle: "EN",
          lede: "一条街，四家小店。每件东西都有它的位置，你只要把它放好。季节会变，朋友也可以来帮一把。",
          start: "开始我的小镇", back: "回到我的小镇",
          hint: "点一家店，直接进去摆。", hintTouch: "点一家店打个招呼，再点一下就进去。",
          error: "小镇暂时没打开，过一会儿再试试。",
          older: "更早的贴纸版本", about: "关于这个作品", preview: "预览",
          names: { cafe: "咖啡馆", flower: "花店", book: "书店", bakery: "面包房" },
        },
        en: {
          kicker: "小镇一角", h1: "A Corner of Town", toggle: "中文",
          lede: "One street, four little shops. Everything has its place — you just put it there. The seasons change, and friends can drop by to help.",
          start: "Start my town", back: "Back to my town",
          hint: "Click a shop to go straight in.", hintTouch: "Tap a shop to say hello, tap again to go in.",
          error: "The town didn't open just now. Try again in a moment.",
          older: "The earlier sticker version", about: "About this project", preview: "Preview",
          names: { cafe: "Café", flower: "Flower shop", book: "Bookshop", bakery: "Bakery" },
        },
      };
      const $ = (id) => document.getElementById(id);
      const LANG_KEY = "lang", TOWN_KEY = "town-owner-v1";
      let lang = "zh";
      try { lang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh"; } catch {}
      const touch = matchMedia("(hover: none)").matches;
      const qSeason = new URLSearchParams(location.search).get("season");

      // my town: one world per browser, remembered with its owner token
      let mine = null;
      try { mine = JSON.parse(localStorage.getItem(TOWN_KEY) || "null"); } catch {}
      if (!(mine && /^[\w-]+$/.test(mine.world || "") && mine.owner)) mine = null;
      const townHref = (m, type) => `/w/${m.world}${type ? `/${type}` : ""}?t=${encodeURIComponent(m.owner)}${qSeason ? `&season=${qSeason}` : ""}`;

      let busy = false;
      async function go(type) {
        if (busy) return;
        if (mine) { location.href = townHref(mine, type); return; }
        busy = true; $("start-town").disabled = true; $("town-error").hidden = true;
        try {
          const res = await fetch("/api/worlds", { method: "POST" });
          if (!res.ok) throw new Error(String(res.status));
          const { world, owner } = await res.json();
          mine = { world, owner };
          try { localStorage.setItem(TOWN_KEY, JSON.stringify(mine)); } catch {}
          location.href = townHref(mine, type);
        } catch {
          $("town-error").hidden = false;
          $("start-town").disabled = false; busy = false;
        }
      }
      $("start-town").addEventListener("click", () => go());
      if (mine) { $("start-town").hidden = true; $("back-town").hidden = false; $("back-town").href = townHref(mine); }

      // the earlier sticker game: one half each, two strangers (POST /api/join → /s/<token>)
      $("older").addEventListener("click", async (e) => {
        let saved = null;
        try { saved = localStorage.getItem("my-half"); } catch {}
        if (saved && /^[\w-]+$/.test(saved)) { location.href = `/s/${saved}`; return; }
        e.currentTarget.disabled = true;
        try {
          const res = await fetch("/api/join", { method: "POST" });
          if (!res.ok) throw new Error(String(res.status));
          const { token } = await res.json();
          try { localStorage.setItem("my-half", token); } catch {}
          location.href = `/s/${token}`;
        } catch {
          $("town-error").hidden = false;
          e.currentTarget.disabled = false;
        }
      });

      const shops = () => ["cafe", "flower", "book", "bakery"].map((type) => ({
        type, label: TEXT[lang].names[type],
      }));
      function render() {
        const t = TEXT[lang];
        document.documentElement.lang = lang;
        $("kicker").textContent = t.kicker;
        $("h1").textContent = t.h1;
        $("lede").textContent = t.lede;
        $("start-town").textContent = t.start;
        $("back-town").textContent = t.back;
        $("hint").textContent = touch ? t.hintTouch : t.hint;
        $("town-error").textContent = t.error;
        $("older").textContent = t.older;
        $("about-link").textContent = t.about;
        $("lang-toggle").textContent = t.toggle;
        street?.setShops(shops());
        street?.setLang(lang);
      }
      let street = null;
      render();
      $("lang-toggle").addEventListener("click", () => {
        lang = lang === "zh" ? "en" : "zh";
        try { localStorage.setItem(LANG_KEY, lang); } catch {}
        render();
      });
      street = await createStreet($("street"), { season: await currentSeason(), lang, shops: shops(), onPick: go,
        // wide screens: the copy sits top-left, so the town is framed to its lower right
        padLeft: () => innerWidth / innerHeight >= 1.2 ? document.querySelector(".copy").getBoundingClientRect().right : 0 });
    </script>
  </body>
</html>
