<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隔壁咖啡店</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="landing">
    <main>
      <p class="kicker">一套两半的造景贴纸</p>
      <h1>隔壁咖啡店</h1>
      <p class="lede">
        你拼一半，一个陌生人拼另一半：一边是店门口和柜台，一边是里屋的座位。<br />
        一个人也能拼完。两个人都在的时候，中间那扇门会打开。
      </p>
      <button id="start" class="btn">开始拼贴</button>
      <p id="resume" hidden><a href="#">继续拼我的那一半 →</a></p>
      <p class="small"><a href="/readme/">关于这个作品</a></p>
    </main>
    <script type="module">
      const KEY = "my-half";
      let saved = null;
      try { saved = localStorage.getItem(KEY); } catch {}
      if (saved) {
        const r = document.getElementById("resume");
        r.hidden = false;
        r.querySelector("a").href = `/s/${saved}`;
      }
      document.getElementById("start").addEventListener("click", async (e) => {
        e.target.disabled = true;
        const { token } = await (await fetch("/api/join", { method: "POST" })).json();
        try { localStorage.setItem(KEY, token); } catch {}
        location.href = `/s/${token}`;
      });
    </script>
  </body>
</html>
