<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小镇一角 · 我的小镇</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/auth.css" />
    <link rel="stylesheet" href="/town.css" />
    <link rel="stylesheet" href="/town/street.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="house town">
    <header class="bar">
      <a href="/" class="brand" id="brand">小镇一角</a>
      <span class="bar-tools">
        <button id="menu-btn" class="tool menu-btn" type="button" aria-expanded="false" aria-controls="bar-menu" aria-label="Menu"><span class="tool-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></span></button>
        <span id="bar-menu" class="bar-menu">
          <button id="who" class="tool" type="button" hidden><span class="tool-ico"></span><span class="tool-label"></span></button>
          <button id="friends" type="button" hidden></button>
          <button id="account" class="tool" type="button" hidden><span class="tool-ico"></span><span class="tool-label"></span></button>
          <button id="lang-toggle" class="lang-toggle bar-toggle tool" type="button" aria-label="Switch language"><span class="tool-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2.3M2.6 5.4h8.8M4.4 7.6c1 2.9 3.4 5 6.6 6.2M9.6 7.6c-1 2.9-3.4 5-6.9 6.2M12.6 21l4-10 4 10M14 17.6h5.2"/></svg></span><span class="tool-label">EN</span></button>
        </span>
      </span>
      <span class="bar-route">
        <button id="town-name" class="town-name" type="button" hidden></button>
      </span>
    </header>
    <main class="tstage">
      <div id="street"></div>
      <p id="status" class="tstatus small" role="status"></p>
      <div id="login-slot" class="login-slot" hidden></div>
      <section id="guest-card" class="tcard" hidden>
        <p id="guest-title" class="tcard-title"></p>
        <p id="guest-left" class="small"></p>
      </section>
      <section id="view-only-card" class="tcard" hidden>
        <p id="view-only-text" class="small"></p>
        <button id="view-only-add" type="button" class="linkish"></button>
      </section>
      <section id="board" class="nboard" hidden>
        <span class="nboard-pin" aria-hidden="true"></span>
        <p id="board-title" class="nboard-title"></p>
        <p id="board-note" class="nboard-note" aria-live="polite"></p>
        <div id="board-editor" class="nboard-editor" hidden>
          <label id="board-edit-title" for="board-input" class="small"></label>
          <div class="nboard-field">
            <input id="board-input" type="text" autocomplete="off" />
            <span id="board-count" class="nboard-count small"></span>
          </div>
          <div id="board-presets" class="nboard-presets"></div>
          <p id="board-msg" class="nboard-msg small" role="status"></p>
          <div class="nboard-actions">
            <button id="board-cancel" type="button" class="nboard-btn ghost"></button>
            <button id="board-clear" type="button" class="nboard-btn ghost"></button>
            <button id="board-save" type="button" class="nboard-btn"></button>
          </div>
        </div>
      </section>
      <div id="season-card" class="tcard season" role="dialog" hidden>
        <p id="season-title" class="tcard-title"></p>
        <p id="season-close" class="small"></p>
      </div>
    </main>
    <script type="module" src="/town.js"></script>
  </body>
</html>
