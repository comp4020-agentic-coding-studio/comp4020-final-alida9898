<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小镇一角 · 我的小镇</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/town.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="house town">
    <header class="bar">
      <button id="lang-toggle" class="lang-toggle bar-toggle" type="button" aria-label="Switch language">EN</button>
      <a href="/" class="brand" id="brand">小镇一角</a>
      <span id="role-line" class="role-line small"></span>
    </header>
    <main class="tstage">
      <canvas id="street" aria-hidden="true"></canvas>
      <div id="plots" class="plots"></div>
      <p id="status" class="tstatus small" role="status"></p>
      <section id="guest-card" class="tcard" hidden>
        <p id="guest-title" class="tcard-title"></p>
        <p id="guest-left" class="small"></p>
      </section>
      <section id="invite-card" class="tcard" hidden>
        <p id="invite-title" class="tcard-title"></p>
        <p id="invite-note" class="small"></p>
        <div class="invite-row">
          <input id="invite-link" class="invite-link" type="text" readonly aria-labelledby="invite-title" />
          <button id="invite-copy" class="invite-copy" type="button"></button>
        </div>
      </section>
      <div id="season-card" class="tcard season" role="dialog" hidden>
        <p id="season-title" class="tcard-title"></p>
        <p id="season-close" class="small"></p>
      </div>
    </main>
    <script type="module" src="/town.js"></script>
  </body>
</html>
