<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小镇一角 · 我的小镇</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/town.css" />
    <link rel="stylesheet" href="/town/street.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="house town">
    <header class="bar">
      <button id="lang-toggle" class="lang-toggle bar-toggle" type="button" aria-label="Switch language">EN</button>
      <a href="/" class="brand" id="brand">小镇一角</a>
      <span id="role-line" class="role-line small"></span>
    </header>
    <main class="tstage">
      <div id="street"></div>
      <p id="status" class="tstatus small" role="status"></p>
      <section id="guest-card" class="tcard" hidden>
        <p id="guest-title" class="tcard-title"></p>
        <p id="guest-left" class="small"></p>
      </section>
      <section id="invite-card" class="tcard" hidden>
        <p id="invite-title" class="tcard-title"></p>
        <p id="invite-note" class="small"></p>
        <div class="invite-row">
          <input id="invite-link" class="invite-link" type="text" readonly aria-labelledby="invite-title" />
          <button id="invite-copy" class="invite-copy" type="button"></button>
        </div>
      </section>
      <section id="board" class="nboard" hidden>
        <span class="nboard-pin" aria-hidden="true"></span>
        <p id="board-title" class="nboard-title"></p>
        <p id="board-note" class="nboard-note" aria-live="polite"></p>
        <div id="board-editor" class="nboard-editor" hidden>
          <label id="board-edit-title" for="board-input" class="small"></label>
          <div class="nboard-field">
            <input id="board-input" type="text" autocomplete="off" />
            <span id="board-count" class="nboard-count small"></span>
          </div>
          <div id="board-presets" class="nboard-presets"></div>
          <p id="board-msg" class="nboard-msg small" role="status"></p>
          <div class="nboard-actions">
            <button id="board-cancel" type="button" class="nboard-btn ghost"></button>
            <button id="board-clear" type="button" class="nboard-btn ghost"></button>
            <button id="board-save" type="button" class="nboard-btn"></button>
          </div>
        </div>
      </section>
      <div id="season-card" class="tcard season" role="dialog" hidden>
        <p id="season-title" class="tcard-title"></p>
        <p id="season-close" class="small"></p>
      </div>
    </main>
    <script type="module" src="/town.js"></script>
  </body>
</html>
