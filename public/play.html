<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小镇一角 · 摆一摆</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/play.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="house play">
    <header class="bar">
      <a href="/" class="brand" id="brand">小镇一角</a>
      <span class="bar-tools">
        <button id="menu-btn" class="tool menu-btn" type="button" aria-expanded="false" aria-controls="bar-menu" aria-label="Menu"><span class="tool-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></span></button>
        <span id="note-chip" class="note-chip small" hidden></span>
        <span id="quota" class="quota small" aria-live="polite" hidden><span class="wide"></span><span class="narrow"></span></span>
        <span id="bar-menu" class="bar-menu">
          <button id="who" class="tool" type="button" hidden><span class="tool-ico"></span><span class="tool-label"></span></button>
          <button id="friends" type="button" hidden></button>
          <button id="mute" class="tool" type="button" aria-pressed="false"><span class="tool-ico">🔈</span><span class="tool-label"></span></button>
          <button id="help" class="tool" type="button"><span class="tool-ico">?</span><span class="tool-label"></span></button>
          <button id="lang-toggle" class="lang-toggle bar-toggle tool" type="button" aria-label="Switch language"><span class="tool-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2.3M2.6 5.4h8.8M4.4 7.6c1 2.9 3.4 5 6.6 6.2M9.6 7.6c-1 2.9-3.4 5-6.9 6.2M12.6 21l4-10 4 10M14 17.6h5.2"/></svg></span><span class="tool-label">EN</span></button>
        </span>
      </span>
      <span class="bar-route">
        <button id="back" class="back-btn" type="button" hidden><span class="wide"></span><span class="narrow"></span></button>
        <nav id="crumbs" class="crumbs" aria-label="breadcrumb"></nav>
      </span>
    </header>
    <main class="stage">
      <canvas id="house"></canvas>
      <p id="loading" class="loading small"></p>
      <div id="hint-card" class="hint-card" role="dialog" aria-labelledby="hint-title" hidden>
        <p id="hint-title" class="hint-title"></p>
        <ul id="hint-list" class="hint-list"></ul>
        <p id="hint-close" class="small hint-close"></p>
      </div>
      <aside id="tray" class="ptray" aria-live="polite">
        <div class="ptray-head">
          <p id="tray-title" class="ptray-title"></p>
          <span class="ptray-head-end">
            <button id="ask-btn" class="ask-btn" type="button" aria-pressed="false" hidden></button>
            <span id="tray-progress" class="small ptray-progress"></span>
          </span>
        </div>
        <p id="tray-hint" class="small ptray-hint"></p>
        <p id="req-hint" class="small req-hint" hidden></p>
        <p id="req-note" class="small req-note" role="status" hidden></p>
        <p id="quota-note" class="small quota-note" role="status" hidden></p>
        <div id="tray-body" class="ptray-body"></div>
        <div id="tray-foot" class="ptray-foot small"></div>
      </aside>
    </main>
    <script type="module" src="/play.js"></script>
  </body>
</html>
